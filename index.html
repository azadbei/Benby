<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BENBY | Eksklyuziv Musiqalar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ASOSIY SOZLAMALAR VA RANGLAR */
        :root {
            --bg-color: #0b111a;
            --card-bg: #151e29;
            --primary: #00f2fe;
            --primary-dark: #4facfe;
            --text-main: #ffffff;
            --text-muted: #8b9eb0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at top right, rgba(79, 172, 254, 0.05), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(0, 242, 254, 0.05), transparent 40%);
        }

        /* HEADER QISMI */
        header {
            text-align: center;
            margin-bottom: 35px;
            margin-top: 15px;
        }
        
        .logo {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(45deg, var(--primary-dark), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            margin-bottom: 5px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo svg {
            width: 28px;
            height: 28px;
            fill: url(#gradient);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 400;
        }

        /* IXCHAM MUSIQALAR GRIDI */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); /* Eniga uzunroq */
            gap: 16px;
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        /* IXCHAM KARTOCHKA DIZAYNI */
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            border: 1px solid rgba(255,255,255,0.04);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border-color: rgba(0, 242, 254, 0.15);
        }

        /* TEPASI: PLAY TUGMA VA NOMI */
        .player-top {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .play-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--primary-dark), var(--primary));
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(0, 242, 254, 0.25);
        }

        .play-btn:active { transform: scale(0.9); }
        .play-btn svg { width: 20px; height: 20px; fill: #fff; margin-left: 2px; transition: all 0.2s; }
        .play-btn.playing svg { margin-left: 0; }

        .track-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-grow: 1;
        }

        .track-title {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .track-artist {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-mini {
            background: rgba(0, 242, 254, 0.1);
            color: var(--primary);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* O'RTASI: PROGRESS BAR */
        .progress-wrapper {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 0 4px;
        }

        .progress-bar {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #233140;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 0 6px var(--primary);
            transition: 0.2s;
        }
        
        .progress-bar::-webkit-slider-thumb:hover { transform: scale(1.3); }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        /* PASTKI: TELEGRAM TUGMASI */
        .tg-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px;
            background-color: rgba(79, 172, 254, 0.08);
            color: var(--primary);
            text-decoration: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
            border: 1px solid transparent;
        }

        .tg-link:hover {
            background-color: rgba(79, 172, 254, 0.15);
            border-color: rgba(0, 242, 254, 0.3);
        }

        .tg-link svg {
            width: 16px;
            height: 16px;
            fill: var(--primary);
        }
    </style>
</head>
<body>

    <!-- SVG Gradient -->
    <svg style="width:0;height:0;position:absolute;" aria-hidden="true">
        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4facfe" />
            <stop offset="100%" stop-color="#00f2fe" />
        </linearGradient>
    </svg>

    <header>
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M12 3V13.55C11.41 13.21 10.73 13 10 13C7.79 13 6 14.79 6 17C6 19.21 7.79 21 10 21C12.21 21 14 19.21 14 17V7H18V3H12Z"/></svg>
            BENBY
        </div>
        <div class="subtitle">Eksklyuziv Musiqalar Katalogi</div>
    </header>

    <div class="grid-container">
        
        <!-- 1-IXCHAM KARTOCHKA -->
        <div class="card">
            <audio class="track-audio" src="https://www.soundhelix.com/architecture/mp3-player/media/1/SoundHelix-Song-1.mp3"></audio>
            
            <div class="player-top">
                <button class="play-btn" onclick="togglePlay(this)">
                    <svg viewBox="0 0 24 24"><path d="M8 5V19L19 12L8 5Z"/></svg>
                </button>
                <div class="track-info">
                    <div class="track-title">Jony - Kometa</div>
                    <div class="track-artist">BENBY <span class="badge-mini">30 sec</span></div>
                </div>
            </div>

            <div class="progress-wrapper">
                <input type="range" class="progress-bar" value="0" min="0" max="100" step="0.1">
                <div class="time-info">
                    <span class="current-time">00:00</span>
                    <span class="total-time">00:30</span>
                </div>
            </div>

            <a href="https://t.me/BENBY" target="_blank" class="tg-link">
                To'liq eshitish
                <svg viewBox="0 0 24 24"><path d="M9.78 18.65L10.06 14.42L17.74 7.5C18.08 7.19 17.67 7.04 17.22 7.31L7.74 13.28L3.64 12C2.76 11.74 2.75 11.14 3.84 10.73L19.81 4.58C20.54 4.32 21.2 4.72 20.96 5.84L18.24 18.65C18.05 19.56 17.5 19.78 16.74 19.36L12.6 16.3L10.61 18.23C10.38 18.46 10.19 18.65 9.78 18.65Z"/></svg>
            </a>
        </div>

        <!-- 2-IXCHAM KARTOCHKA -->
        <div class="card">
            <audio class="track-audio" src="https://www.soundhelix.com/architecture/mp3-player/media/1/SoundHelix-Song-2.mp3"></audio>
            
            <div class="player-top">
                <button class="play-btn" onclick="togglePlay(this)">
                    <svg viewBox="0 0 24 24"><path d="M8 5V19L19 12L8 5Z"/></svg>
                </button>
                <div class="track-info">
                    <div class="track-title">ЧАСЫ</div>
                    <div class="track-artist">BENBY <span class="badge-mini">30 sec</span></div>
                </div>
            </div>

            <div class="progress-wrapper">
                <input type="range" class="progress-bar" value="0" min="0" max="100" step="0.1">
                <div class="time-info">
                    <span class="current-time">00:00</span>
                    <span class="total-time">00:30</span>
                </div>
            </div>

            <a href="https://t.me/BENBY" target="_blank" class="tg-link">
                To'liq eshitish
                <svg viewBox="0 0 24 24"><path d="M9.78 18.65L10.06 14.42L17.74 7.5C18.08 7.19 17.67 7.04 17.22 7.31L7.74 13.28L3.64 12C2.76 11.74 2.75 11.14 3.84 10.73L19.81 4.58C20.54 4.32 21.2 4.72 20.96 5.84L18.24 18.65C18.05 19.56 17.5 19.78 16.74 19.36L12.6 16.3L10.61 18.23C10.38 18.46 10.19 18.65 9.78 18.65Z"/></svg>
            </a>
        </div>

    </div>

    <script>
        const playIcon = '<svg viewBox="0 0 24 24"><path d="M8 5V19L19 12L8 5Z"/></svg>';
        const pauseIcon = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        const audios = document.querySelectorAll('.track-audio');
        
        audios.forEach(audio => {
            const card = audio.closest('.card');
            const btn = card.querySelector('.play-btn');
            const progressBar = card.querySelector('.progress-bar');
            const currentTimeEl = card.querySelector('.current-time');
            const totalTimeEl = card.querySelector('.total-time');

            audio.addEventListener('loadedmetadata', () => {
                totalTimeEl.textContent = formatTime(audio.duration);
            });

            audio.addEventListener('timeupdate', () => {
                const progress = (audio.currentTime / audio.duration) * 100;
                progressBar.value = progress || 0;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                
                // 30 soniyalik Tizer effekti
                if(audio.currentTime >= 30) {
                    audio.pause();
                    audio.currentTime = 0;
                }
            });

            progressBar.addEventListener('input', (e) => {
                const seekTime = (e.target.value / 100) * audio.duration;
                audio.currentTime = seekTime;
            });
            
            audio.addEventListener('ended', () => {
                btn.innerHTML = playIcon;
                btn.classList.remove('playing');
                progressBar.value = 0;
            });
        });

        window.togglePlay = function(btn) {
            const card = btn.closest('.card');
            const currentAudio = card.querySelector('.track-audio');

            // Boshqa audiolarni to'xtatish
            document.querySelectorAll('.track-audio').forEach(a => {
                if(a !== currentAudio) {
                    a.pause();
                    const otherBtn = a.closest('.card').querySelector('.play-btn');
                    otherBtn.innerHTML = playIcon;
                    otherBtn.classList.remove('playing');
                }
            });

            // Hozirgisini boshqarish
            if (currentAudio.paused) {
                currentAudio.play();
                btn.innerHTML = pauseIcon;
                btn.classList.add('playing');
            } else {
                currentAudio.pause();
                btn.innerHTML = playIcon;
                btn.classList.remove('playing');
            }
        };
    </script>
</body>
</html>
