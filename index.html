<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>BENBY - Telegram Pro Player</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background-color: #0e1621;
        display: flex;
        justify-content: center;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }

      .app-container {
        width: 100%;
        max-width: 450px;
        background-color: #0e1621;
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        position: relative;
        overflow: hidden;
      }
      svg {
        display: block;
      }

      /* ZAGRUZKA ANIMATSIYASI */
      .spinner {
        width: 24px;
        height: 24px;
        border: 2.5px solid rgba(255, 255, 255, 0.3);
        border-top: 2.5px solid #ffffff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }

      /* MENYUNI YOPISH UCHUN BLUR QOPLAMA (ORQADAGI TUGMALARNI TO'LIQ BLOKLAYDI) */
      .blur-dismiss-overlay {
        position: absolute;
        inset: 0;
        z-index: 85;
        display: none;
        background: rgba(8, 13, 20, 0.18);
        cursor: default;
        touch-action: none;
      }
      .app-container.menu-open-blur .blur-dismiss-overlay {
        display: block;
      }

      /* HEADER */
      .tg-header {
        background-color: #0e1621;
        color: #fff;
        display: flex;
        flex-direction: column;
        z-index: 20;
        position: relative;
        flex-shrink: 0;
      }
      .top-bar {
        display: flex;
        align-items: center;
        height: 60px;
        padding: 6px 8px;
        gap: 7px;
        background-color: #0e1621;
      }
      .back-pill-btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background-color: #212f3d;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background-color 0.15s, transform 0.12s;
        flex-shrink: 0;
        text-decoration: none;
      }
      .back-pill-btn:active {
        background-color: #2a3b4c;
        transform: scale(0.95);
      }
      .back-pill-btn svg {
        width: 22px;
        height: 22px;
        fill: #e8eff6;
      }

      .middle-capsule {
        flex-grow: 1;
        display: flex;
        align-items: center;
        height: 44px;
        padding: 0 12px 0 5px;
        border-radius: 22px;
        background-color: #212f3d;
        border: none;
        overflow: hidden;
        cursor: pointer;
        text-align: left;
        min-width: 0;
        transition: background-color 0.15s, transform 0.12s;
      }
      .middle-capsule:hover {
        background-color: #263647;
      }
      .middle-capsule:active {
        transform: scale(0.99);
      }
      .avatar-main {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background-color: #0e1621;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9.5px;
        font-weight: 700;
        margin-right: 10px;
        color: #fff;
        flex-shrink: 0;
      }

      .info {
        display: flex;
        flex-direction: column;
        justify-content: center;
        line-height: 1.15;
        min-width: 0;
      }
      .title {
        font-size: 16px;
        font-weight: 600;
        display: flex;
        align-items: center;
        color: #f4f7fa;
        letter-spacing: 0.2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .title span {
        font-size: 14px;
        margin-left: 4px;
      }
      .status {
        font-size: 12.5px;
        color: #8ea1b4;
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .right-capsule {
        display: flex;
        align-items: center;
        height: 44px;
        padding: 0 4px;
        border-radius: 22px;
        background-color: #212f3d;
        border: none;
        flex-shrink: 0;
      }
      .capsule-icon-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background-color 0.15s, transform 0.12s;
        flex-shrink: 0;
        text-decoration: none;
        background: none;
        border: none;
      }
      .capsule-icon-btn:active {
        background-color: rgba(255, 255, 255, 0.1);
        transform: scale(0.92);
      }
      .capsule-icon-btn svg {
        width: 21px;
        height: 21px;
        fill: #e8eff6;
      }

      /* QIDIRUV PANELI */
      .search-bar {
        display: none;
        align-items: center;
        height: 60px;
        padding: 6px 8px;
        gap: 6px;
        background-color: #0e1621;
      }
      .search-bar.active {
        display: flex;
      }
      .search-input-wrap {
        flex-grow: 1;
        display: flex;
        align-items: center;
        background-color: #212f3d;
        border: none;
        border-radius: 22px;
        height: 42px;
        padding: 0 12px;
        gap: 8px;
      }
      .search-input {
        flex-grow: 1;
        background: none;
        border: none;
        outline: none;
        color: #ffffff;
        font-size: 14.5px;
      }
      .search-input::placeholder {
        color: #8ea1b4;
      }
      .search-clear-btn {
        background: none;
        border: none;
        color: #8ea1b4;
        font-size: 14px;
        cursor: pointer;
        padding: 2px 6px;
        display: none;
      }
      .search-clear-btn.visible {
        display: block;
      }

      /* HEADER 3 NUQTA DROPDOWN MENYU (DOIM TINIQ VA BOSILADIGAN) */
      .header-menu {
        position: absolute;
        top: 56px;
        right: 10px;
        background-color: #1f2c3a;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
        padding: 5px;
        min-width: 215px;
        z-index: 95;
        display: none;
        flex-direction: column;
        filter: none !important;
        pointer-events: auto !important;
      }
      .header-menu.open {
        display: flex;
      }
      .header-menu-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 8px;
        color: #ffffff;
        text-decoration: none;
        font-size: 13.5px;
        font-weight: 500;
        background: none;
        border: none;
        width: 100%;
        text-align: left;
        cursor: pointer;
        transition: background-color 0.15s, color 0.15s;
      }
      .header-menu-item:hover {
        background-color: rgba(100, 181, 239, 0.14);
        color: #64b5ef;
      }
      .header-menu-item svg {
        width: 17px;
        height: 17px;
        fill: currentColor;
        flex-shrink: 0;
      }

      /* TELEGRAM USLUBIDAGI IXCHAM MINI-PLEYER BOSHQARUV PANELI */
      .top-mini-player {
        display: flex;
        align-items: center;
        background-color: #17212b;
        border-top: 1px solid #101921;
        padding: 0 8px;
        gap: 6px;
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        pointer-events: none;
        transition:
          max-height 0.22s ease,
          opacity 0.2s ease,
          height 0.22s ease;
      }
      .top-mini-player.visible {
        max-height: 36px;
        height: 36px;
        opacity: 1;
        pointer-events: auto;
      }
      .mini-play-btn {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: none;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: background-color 0.15s, transform 0.12s;
      }
      .mini-play-btn:hover {
        background-color: rgba(100, 181, 239, 0.14);
      }
      .mini-play-btn:active {
        transform: scale(0.9);
      }
      .mini-play-btn svg {
        width: 16px;
        height: 16px;
        fill: #64b5ef;
      }
      .mini-track-info {
        flex-grow: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        cursor: pointer;
      }
      .mini-track-title {
        font-size: 12.5px;
        font-weight: 500;
        color: #e8eff6;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mini-close-btn {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: none;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: background-color 0.15s, transform 0.15s;
      }
      .mini-close-btn:hover {
        background-color: rgba(255, 255, 255, 0.08);
      }
      .mini-close-btn:active {
        transform: scale(0.9);
      }
      .mini-close-btn svg {
        width: 11px;
        height: 11px;
        fill: #7f91a4;
      }

      /* QADALGAN XABAR VA BAHOLASH */
      .pinned {
        display: flex;
        align-items: center;
        padding: 7px 10px 7px 15px;
        border-top: 1px solid #16212e;
        background-color: #0e1621;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition:
          opacity 0.45s ease,
          transform 0.45s ease,
          max-height 0.45s ease,
          padding 0.45s ease;
        max-height: 70px;
        opacity: 1;
      }
      .pinned.dismissed {
        opacity: 0;
        transform: translateY(-10px) scale(0.95);
        max-height: 0;
        padding-top: 0;
        padding-bottom: 0;
        border-top-width: 0;
        pointer-events: none;
      }
      .pinned.locked {
        cursor: default;
      }
      .pinned-line {
        width: 2.5px;
        height: 34px;
        background-color: #64b5ef;
        border-radius: 2px;
        margin-right: 12px;
        flex-shrink: 0;
      }
      .pinned-content {
        flex-grow: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .pinned-title {
        font-size: 13.5px;
        font-weight: 600;
        color: #64b5ef;
        margin-bottom: 2px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .pinned-text {
        font-size: 13.5px;
        color: #d6e2ee;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 5 YULDUZLI BAHOLASH PANELI */
      .rating-stars {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 2px;
      }
      .star-btn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.15s ease;
      }
      .star-btn:hover {
        transform: scale(1.22);
      }
      .star-btn:active {
        transform: scale(0.92);
      }
      .star-btn svg {
        width: 21px;
        height: 21px;
        fill: #243546;
        stroke: #64b5ef;
        stroke-width: 1.4;
        transition: fill 0.15s, stroke 0.15s;
      }
      .star-btn.active svg,
      .star-btn.hovered svg {
        fill: #64b5ef;
        stroke: #64b5ef;
      }

      .close-btn {
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: none;
        border: none;
        cursor: pointer;
        flex-shrink: 0;
        transition: background-color 0.15s, transform 0.2s;
      }
      .close-btn:hover {
        background-color: rgba(255, 255, 255, 0.08);
      }
      .close-btn:active {
        transform: rotate(90deg) scale(0.9);
      }
      .close-btn svg {
        width: 13px;
        height: 13px;
        fill: #7f91a4;
      }

      /* TINNIQ 5 SONIYALIK BURCHAKLI PARCHALANISH ZARRALARI */
      .shatter-piece {
        position: fixed;
        pointer-events: none;
        z-index: 999;
        opacity: 0.96;
        animation: shatterCrisp5s var(--dur, 5s) cubic-bezier(0.12, 0.68, 0.22, 1) var(--delay, 0s) forwards;
      }
      @keyframes shatterCrisp5s {
        0% {
          opacity: 0.96;
          transform: translate(0, 0) rotate(0deg) scale(1);
        }
        20% {
          opacity: 0.9;
        }
        65% {
          opacity: 0.45;
        }
        100% {
          opacity: 0;
          transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.18);
        }
      }

      /* CHAT QISMI — TELEFONDA SILLIQ SCROLL UCHUN OPTIMALLASHGAN */
      .chat-area {
        flex-grow: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: contain;
        transform: translateZ(0);
        padding: 8px 10px 18px 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background-color: #0e1621;
        position: relative;
      }
      .chat-area::-webkit-scrollbar {
        display: none;
      }

      /* HAR BIR POST UCHUN ALOHIDA ZONA */
      .post-zone {
        width: 100%;
        background-color: rgba(23, 33, 43, 0.45);
        border: 1px solid rgba(127, 145, 164, 0.12);
        border-radius: 16px;
        padding: 8px;
        transition: border-color 0.18s ease, background-color 0.18s ease, filter 0.18s ease;
      }

      /* 3 NUQTA MENYUSI OCHILGANDA BLUR ORQASIDAGI BARCHA ELEMENTLAR HAM XIRALASHADI HAM BOSILMAYDI */
      .app-container.menu-open-blur .back-pill-btn,
      .app-container.menu-open-blur .middle-capsule,
      .app-container.menu-open-blur #open-search-btn,
      .app-container.menu-open-blur .search-bar,
      .app-container.menu-open-blur .top-mini-player,
      .app-container.menu-open-blur .pinned,
      .app-container.menu-open-blur .subscriber-bar,
      .app-container.menu-open-blur .date-badge,
      .app-container.menu-open-blur .empty-search-state,
      .app-container.menu-open-blur .play-circle,
      .app-container.menu-open-blur .track-info,
      .app-container.menu-open-blur .expanded-player,
      .app-container.menu-open-blur .bubble-footer,
      .app-container.menu-open-blur .post-tg-btn,
      .app-container.menu-open-blur .side-actions-col,
      .app-container.menu-open-blur .audio-box {
        filter: blur(2.8px);
        pointer-events: none !important;
        user-select: none;
        transition: filter 0.16s ease;
      }

      .app-container.menu-open-blur .capsule-icon-btn:not(.menu-active-trigger),
      .app-container.menu-open-blur .more-btn:not(.menu-active-trigger) {
        filter: blur(2.8px);
        pointer-events: none !important;
        transition: filter 0.16s ease;
      }

      .app-container.menu-open-blur .bubble:has(.post-menu.open) {
        background-color: transparent;
        box-shadow: none;
      }

      /* KO'P BOSIB TURILGANDA (LONG-PRESS) BOSILGAN POSTDAN TASHQARI HAMMA EKRAN BLUR BO'LADI */
      .app-container.post-long-press-active .tg-header,
      .app-container.post-long-press-active .subscriber-bar,
      .app-container.post-long-press-active .date-badge,
      .app-container.post-long-press-active .empty-search-state,
      .app-container.post-long-press-active .post-zone:not(.long-pressed-zone) {
        filter: blur(3.2px);
        pointer-events: none !important;
        transition: filter 0.16s ease;
      }

      .post-zone.long-pressed-zone {
        position: relative;
        z-index: 50;
        background-color: rgba(24, 37, 51, 0.96);
        border-color: rgba(100, 181, 239, 0.55);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
        filter: none !important;
      }

      .capsule-icon-btn.menu-active-trigger,
      .more-btn.menu-active-trigger,
      .header-menu,
      .post-menu {
        filter: none !important;
        pointer-events: auto !important;
      }

      .capsule-icon-btn.menu-active-trigger,
      .more-btn.menu-active-trigger {
        position: relative;
        z-index: 95;
      }

      .header-menu {
        position: absolute;
        z-index: 96;
      }

      .post-menu {
        position: absolute;
        z-index: 96;
      }

      .date-badge {
        align-self: center;
        background-color: #17212b;
        color: #ffffff;
        font-size: 13px;
        font-weight: 500;
        padding: 4px 12px;
        border-radius: 12px;
        margin: 6px 0 2px 0;
      }

      .empty-search-state {
        text-align: center;
        color: #7f91a4;
        font-size: 14px;
        padding: 40px 16px;
      }

      .msg-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        position: relative;
        margin-bottom: 0;
        scroll-margin-top: 12px;
        user-select: none;
        -webkit-user-select: none;
      }

      .bubble {
        background-color: #182533;
        border-radius: 14px;
        border-bottom-left-radius: 4px;
        padding: 8px 12px 8px 12px;
        flex-grow: 1;
        max-width: calc(100% - 42px);
        display: flex;
        flex-direction: column;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
        position: relative;
      }

      /* O'NG YONDAGI VERTIKAL YIG'ISH + 0s + TO'XTATISH USTUNI */
      .side-actions-col {
        align-self: flex-start;
        margin-top: 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .toggle-panel-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid rgba(127, 145, 164, 0.25);
        background-color: #17212b;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: transform 0.15s, background-color 0.15s, border-color 0.15s;
      }
      .toggle-panel-btn:hover {
        background-color: rgba(100, 181, 239, 0.16);
        border-color: rgba(100, 181, 239, 0.55);
      }
      .toggle-panel-btn:active {
        transform: scale(0.9);
      }
      .toggle-panel-btn.is-open {
        background-color: rgba(100, 181, 239, 0.14);
        border-color: rgba(100, 181, 239, 0.45);
      }
      .toggle-panel-btn svg {
        width: 17px;
        height: 17px;
        stroke: #9ab0c4;
        fill: none;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: stroke 0.15s;
      }
      .toggle-panel-btn:hover svg,
      .toggle-panel-btn.is-open svg {
        stroke: #64b5ef;
      }

      .side-sub-btn {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 1px solid rgba(127, 145, 164, 0.2);
        background-color: #17212b;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: transform 0.15s, background-color 0.15s, border-color 0.15s;
      }
      .side-sub-btn:hover {
        background-color: rgba(100, 181, 239, 0.16);
        border-color: rgba(100, 181, 239, 0.5);
      }
      .side-sub-btn:active {
        transform: scale(0.9);
      }
      .side-sub-btn svg {
        width: 15px;
        height: 15px;
        stroke: #9ab0c4;
        fill: #9ab0c4;
        transition: stroke 0.15s, fill 0.15s;
      }
      .side-sub-btn:hover svg {
        stroke: #64b5ef;
        fill: #64b5ef;
      }

      .audio-box {
        display: flex;
        align-items: center;
        margin-bottom: 4px;
        cursor: pointer;
        position: relative;
      }
      .play-circle {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background-color: #64b5ef;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-right: 12px;
        flex-shrink: 0;
        color: #fff;
      }
      .play-circle.playing {
        background-color: #1db954;
      }
      .play-circle svg {
        width: 22px;
        height: 22px;
        fill: #ffffff;
        margin-left: 3px;
      }
      .play-circle.playing svg {
        margin-left: 0;
      }

      .track-info {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        overflow: hidden;
        justify-content: center;
      }
      .track-name {
        font-size: 15.5px;
        font-weight: 500;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 2px;
      }
      .track-artist {
        font-size: 13.5px;
        color: #7f91a4;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .track-size {
        font-size: 12px;
        color: #7f91a4;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .blue-dot {
        color: #64b5ef;
        font-size: 10px;
        margin-left: 2px;
      }

      /* 3 NUQTA VA MENYU (DOIM TINIQ) */
      .more-btn {
        background: none;
        border: none;
        color: #9ab0c4;
        font-weight: bold;
        font-size: 18px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        align-self: flex-start;
        flex-shrink: 0;

        stroke-linejoin: round;

      function shatterElementIntoFragments(element) {
        if (!element) return;
        const rect = element.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return;

        const sectionColors = [
          "#0e1621",
          "#182533",
          "#212f3d",
          "#64b5ef",
          "#7f91a4",
          "#d6e2ee",
        ];

        const shardPolygons = [
          "polygon(0% 0%, 100% 15%, 78% 100%, 10% 85%)",
          "polygon(12% 0%, 100% 0%, 88% 100%, 0% 78%)",
          "polygon(0% 18%, 85% 0%, 100% 88%, 20% 100%)",
          "polygon(8% 4%, 92% 12%, 100% 90%, 0% 96%)",
          "polygon(0% 8%, 95% 0%, 82% 95%, 14% 100%)",
          "polygon(15% 2%, 100% 20%, 72% 100%, 0% 72%)",
        ];

        const cols = 22;
        const rows = 4;
        const pieceW = rect.width / cols;
        const pieceH = rect.height / rows;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const frag = document.createElement("div");
            frag.className = "shatter-piece";

            const baseSize = Math.max(5, Math.min(pieceW, pieceH) * 0.92);
            const width = Math.max(5, baseSize * (0.75 + Math.random() * 0.55));
            const height = Math.max(5, baseSize * (0.75 + Math.random() * 0.55));

            const left = rect.left + c * pieceW + (pieceW - width) / 2;
            const top = rect.top + r * pieceH + (pieceH - height) / 2;

            const normX = (c - (cols - 1) / 2) / ((cols - 1) / 2 || 1);
            const normY = (r - (rows - 1) / 2) / ((rows - 1) / 2 || 1);
            const spreadAngle = Math.atan2(normY, normX) + (Math.random() * 0.7 - 0.35);
            const distance = 45 + Math.random() * 95;

            const tx = Math.cos(spreadAngle) * distance + normX * 36;
            const ty = Math.sin(spreadAngle) * (distance * 0.65) + 22 + Math.random() * 28;
            const rot = (Math.random() * 420 - 210).toFixed(1) + "deg";

            const dur = (4.6 + Math.random() * 0.5).toFixed(2) + "s";
            const delay = (Math.random() * 0.35).toFixed(2) + "s";

            const color = sectionColors[(r * 7 + c * 3) % sectionColors.length];
            const poly = shardPolygons[(r * 5 + c) % shardPolygons.length];

            frag.style.left = `${left.toFixed(1)}px`;
            frag.style.top = `${top.toFixed(1)}px`;
            frag.style.width = `${width.toFixed(1)}px`;
            frag.style.height = `${height.toFixed(1)}px`;
            frag.style.backgroundColor = color;
            frag.style.clipPath = poly;
            frag.style.setProperty("--tx", `${tx.toFixed(1)}px`);
            frag.style.setProperty("--ty", `${ty.toFixed(1)}px`);
            frag.style.setProperty("--rot", rot);
            frag.style.setProperty("--dur", dur);
            frag.style.setProperty("--delay", delay);

            document.body.appendChild(frag);
            setTimeout(() => frag.remove(), 5300);
          }
        }
      }

      window.resetTrackToZero = function (index, event) {
        if (event) event.stopPropagation();
        const track = localPlaylist[index];
        if (!track) return;

        const encodedSrc = encodeURI(track.src);
        const isSameTrack =
          currentIndex === index && audioPlayer.getAttribute("src") === encodedSrc;

        resetTrackProgressUI(index);

        if (isSameTrack) {
          audioPlayer.currentTime = 0;
        } else {
          currentIndex = index;
          cacheActiveTrackElements(index);
          audioPlayer.pause();
          audioPlayer.setAttribute("src", encodedSrc);
          audioPlayer.load();
          audioPlayer.currentTime = 0;
        }
        updateTopMiniPlayer();
      };

      window.stopTrackCompletely = function (index, event) {
        if (event) event.stopPropagation();
        isAudioLoading = false;
        clearTimeout(loadTimeout);

        if (currentIndex === index) {
          audioPlayer.pause();
          try {
            audioPlayer.currentTime = 0;
          } catch (_) {}
        }

        resetTrackProgressUI(index);
        updatePlayIcons();
        updateTopMiniPlayer();
      };

      window.seekBySeconds = function (index, deltaSeconds, event) {
        if (event) event.stopPropagation();
        const track = playlist[index];
        if (!track) return;

        document
          .querySelectorAll(".bubble")
          .forEach((b) => b.classList.remove("expanded"));
        const bEl = document.getElementById(`bubble-${index}`);
        if (bEl) bEl.classList.add("expanded");
        syncPanelButtons();

        const encodedSrc = encodeURI(track.src);
        const isSameTrack =
          currentIndex === index && audioPlayer.getAttribute("src") === encodedSrc;

        const applySeek = () => {
          const duration =
            !isNaN(audioPlayer.duration) && isFinite(audioPlayer.duration)
              ? audioPlayer.duration
              : 0;
          const nextTime = Math.max(
            0,
            duration > 0
              ? Math.min(duration, (audioPlayer.currentTime || 0) + deltaSeconds)
              : (audioPlayer.currentTime || 0) + deltaSeconds,
          );
          audioPlayer.currentTime = nextTime;
          if (activeCurrentTimeEl) activeCurrentTimeEl.innerText = formatTime(nextTime);
          if (activeProgressEl && duration > 0) {
            activeProgressEl.value = (nextTime / duration) * 100;
          }
          audioPlayer.play().catch(() => {});
          updatePlayIcons();
          updateTopMiniPlayer();
        };

        if (!isSameTrack) {
          currentIndex = index;
          cacheActiveTrackElements(index);
          isAudioLoading = true;
          audioPlayer.pause();
          audioPlayer.setAttribute("src", encodedSrc);
          audioPlayer.load();
          updatePlayIcons();
          updateTopMiniPlayer();

          const onReady = () => {
            audioPlayer.removeEventListener("loadedmetadata", onReady);
            audioPlayer.removeEventListener("canplay", onReady);
            applySeek();
          };
          audioPlayer.addEventListener("loadedmetadata", onReady);
          audioPlayer.addEventListener("canplay", onReady);
        } else {
          currentIndex = index;
          cacheActiveTrackElements(index);
          applySeek();
        }
      };

      function syncPanelButtons() {
        document.querySelectorAll(".msg-row").forEach((row) => {
          const bubble = row.querySelector(".bubble");
          const btn = row.querySelector(".toggle-panel-btn");
          if (!bubble || !btn) return;

          const isExpanded = bubble.classList.contains("expanded");
          if (isExpanded) {
            btn.classList.add("is-open");
            btn.innerHTML = verticalCollapseIcon;
            btn.title = "Pleyerni yig'ish";
            btn.setAttribute("aria-label", "Pleyerni yig'ish");
          } else {
            btn.classList.remove("is-open");
            btn.innerHTML = verticalExpandIcon;
            btn.title = "Pleyerni ochish";
            btn.setAttribute("aria-label", "Pleyerni ochish");
          }
        });
      }

      function renderPlaylist(scrollToBottom = true) {
        chatArea.innerHTML = "";
        playlist = localPlaylist.map((data, originalIndex) => ({
          ...data,
          originalIndex,
        }));

        const filtered = searchQuery
          ? playlist.filter(
              (item) =>
                item.title.toLowerCase().includes(searchQuery) ||
                item.artist.toLowerCase().includes(searchQuery),
            )
          : playlist;

        const dateDiv = document.createElement("div");
        dateDiv.className = "date-badge";
        const bugun = new Date();
        const oylar = [
          "yanvar",
          "fevral",
          "mart",
          "aprel",
          "may",
          "iyun",
          "iyul",
          "avgust",
          "sentyabr",
          "oktyabr",
          "noyabr",
          "dekabr",
        ];
        dateDiv.innerText = `${bugun.getDate()} ${oylar[bugun.getMonth()]} ${bugun.getFullYear()}`;
        chatArea.appendChild(dateDiv);

        if (!localPlaylist.length) {
          statusText.innerText = "Musiqalar yo'q";
          updateScrollDownButtonVisibility();
          return;
        }
        statusText.innerText = searchQuery
          ? `Topildi: ${filtered.length} ta`
          : `${localPlaylist.length} ta musiqa`;

        if (!filtered.length) {
          const emptyDiv = document.createElement("div");
          emptyDiv.className = "empty-search-state";
          emptyDiv.innerText = `"${searchQuery}" bo'yicha musiqa topilmadi`;
          chatArea.appendChild(emptyDiv);
          updateScrollDownButtonVisibility();
          return;
        }

        filtered.forEach((data) => {
          const index = data.originalIndex;
          const timeString =
            data.time ||
            new Date().toLocaleTimeString("uz-UZ", {
              hour: "2-digit",
              minute: "2-digit",
            });
          const views = data.views || 150;
          const tgUrl = data.tgLink || TELEGRAM_CHANNEL_URL;
          const isCurrent = currentIndex === index;
          const isExpandedClass = isCurrent ? "expanded" : "";

          const postZone = document.createElement("div");
          postZone.className = "post-zone";
          postZone.id = `zone-${index}`;
          postZone.onpointerdown = (e) => startPostLongPress(index, e);
          postZone.onpointermove = (e) => movePostLongPress(e);

          postZone.innerHTML = `
            <div class="msg-row" id="row-${index}">
              <div class="bubble ${isExpandedClass}" id="bubble-${index}">
                <div class="audio-box" onclick="togglePlay(${index})">
                  <div class="play-circle" id="circle-${index}">${playIcon}</div>
                  <div class="track-info">
                    <div class="track-name">${data.title}</div>
                    <div class="track-artist">${data.artist}</div>
                    <div class="track-size">Audio fayl <span class="blue-dot">●</span></div>
                  </div>
                  <button
                    type="button"
                    class="more-btn"
                    data-menu-index="${index}"
                    title="Yuklab olish"
                    aria-label="Yuklab olish"
                    onclick="togglePostMenu(${index}, event)"
                  >⋮</button>
                </div>

                <div class="post-menu" id="menu-${index}" onclick="event.stopPropagation()" onpointerdown="event.stopPropagation()">
                  <div class="menu-item" onclick="downloadTrack(${index}, event)">
                    ${downloadIcon}
                    <span>Yuklab olish (MP3)</span>
                  </div>
                </div>

                <div class="expanded-player">
                  <div class="progress-container">
                    <span id="current-time-${index}">00:00</span>
                    <input type="range" class="progress-bar" id="progress-${index}" value="0" min="0" max="100" step="0.1">
                    <span id="total-time-${index}">00:00</span>
                  </div>
                  <div class="controls-container">
                    <button type="button" class="ctrl-btn seek-icon-btn" title="5 soniya orqaga" aria-label="5 soniya orqaga" onclick="seekBySeconds(${index}, -5, event)">
                      ${rewind5Icon}
                    </button>
                    <button type="button" class="ctrl-btn" title="Oldingi musiqa" aria-label="Oldingi musiqa" onclick="playPrev(event)">${prevIcon}</button>
                    <button type="button" class="ctrl-btn play-pause-btn" onclick="togglePlay(${index}, event)" id="main-play-btn-${index}">
                      ${playIcon}
                    </button>
                    <button type="button" class="ctrl-btn" title="Keyingi musiqa" aria-label="Keyingi musiqa" onclick="playNext(event)">${nextIcon}</button>
                    <button type="button" class="ctrl-btn seek-icon-btn" title="5 soniya oldinga" aria-label="5 soniya oldinga" onclick="seekBySeconds(${index}, 5, event)">
                      ${forward5Icon}
                    </button>
                  </div>
                </div>

                <div class="bubble-footer">
                  <a href="${tgUrl}" target="_blank" class="signature">BENBY <span>👑</span></a>
                  <div class="meta">
                    <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12C2.73 16.39 7 19.5 12 19.5C17 19.5 21.27 16.39 23 12C21.27 7.61 17 4.5 12 4.5ZM12 17C9.24 17 7 14.76 7 12C7 9.24 9.24 7 12 7C14.76 7 17 9.24 17 12C17 14.76 14.76 17 12 17ZM12 9C10.34 9 9 10.34 9 12C9 13.66 10.34 15 12 15C13.66 15 15 13.66 15 12C15 10.34 13.66 9 12 9Z"/></svg>
                    ${views} • ${timeString}
                  </div>
                </div>

                <a href="${tgUrl}" target="_blank" class="post-tg-btn">
                  ${tgIcon}
                  <span>Telegramda ochish</span>
                </a>
              </div>

              <div class="side-actions-col">
                <button
                  type="button"
                  class="toggle-panel-btn"
                  id="toggle-panel-${index}"
                  title="Pleyerni ochish"
                  aria-label="Pleyerni ochish"
                  onclick="handlePanelToggle(${index}, event)"
                >${verticalExpandIcon}</button>

                <button
                  type="button"
                  class="side-sub-btn"
                  id="reset-zero-${index}"
                  title="0 soniyaga qaytarish"
                  aria-label="0 soniyaga qaytarish"
                  onclick="resetTrackToZero(${index}, event)"
                >${resetZeroIcon}</button>

                <button
                  type="button"
                  class="side-sub-btn"
                  id="stop-track-${index}"
                  title="To'xtatish"
                  aria-label="To'xtatish"
                  onclick="stopTrackCompletely(${index}, event)"
                >${stopTrackIcon}</button>
              </div>
            </div>
          `;
          chatArea.appendChild(postZone);

          const progressBar = postZone.querySelector(`#progress-${index}`);
          progressBar.addEventListener("input", (e) => {
            if (currentIndex === index && audioPlayer.duration) {
              isSeeking = true;
              const seekTime = (e.target.value / 100) * audioPlayer.duration;
              if (activeCurrentTimeEl) {
                activeCurrentTimeEl.innerText = formatTime(seekTime);
              }
            }
          });
          progressBar.addEventListener("change", (e) => {
            if (currentIndex === index && audioPlayer.duration) {
              audioPlayer.currentTime =
                (e.target.value / 100) * audioPlayer.duration;
              isSeeking = false;
            }
          });
        });

        cacheActiveTrackElements(currentIndex);
        updatePlayIcons();
        syncPanelButtons();
        refreshBackdropBlurState();

        if (scrollToBottom && !searchQuery) {
          chatArea.scrollTop = chatArea.scrollHeight;
          requestAnimationFrame(() => {
            chatArea.scrollTop = chatArea.scrollHeight;
            updateScrollDownButtonVisibility();
          });
        } else {
          updateScrollDownButtonVisibility();
        }
      }

      function startTrack(index) {
        const track = localPlaylist[index];
        if (!track) return;

        document
          .querySelectorAll(".bubble")
          .forEach((b) => b.classList.remove("expanded"));
        const targetBubble = document.getElementById(`bubble-${index}`);
        if (targetBubble) targetBubble.classList.add("expanded");
        syncPanelButtons();

        const encodedSrc = encodeURI(track.src);
        const isSameTrack =
          currentIndex === index && audioPlayer.getAttribute("src") === encodedSrc;

        currentIndex = index;
        cacheActiveTrackElements(index);

        if (isSameTrack) {
          audioPlayer.play().catch(() => {});
        } else {
          isAudioLoading = true;
          audioPlayer.pause();
          audioPlayer.setAttribute("src", encodedSrc);
          audioPlayer.load();
          audioPlayer.play().catch(() => {});
        }
        updatePlayIcons();
        updateTopMiniPlayer();
      }

      window.handlePanelToggle = function (index, event) {
        if (event) event.stopPropagation();
        const bubble = document.getElementById(`bubble-${index}`);
        if (!bubble) return;

        const isExpanded = bubble.classList.contains("expanded");

        if (isExpanded) {
          bubble.classList.remove("expanded");
          if (currentIndex === index) {
            audioPlayer.pause();
            try {
              audioPlayer.currentTime = 0;
            } catch (_) {}
            resetTrackProgressUI(index);
            isAudioLoading = false;
            clearTimeout(loadTimeout);
            updatePlayIcons();
            updateTopMiniPlayer();
          }
          syncPanelButtons();
        } else {
          startTrack(index);
        }
      };

      window.togglePlay = function (index, event) {
        if (event) event.stopPropagation();

        if (currentIndex === index) {
          const bubble = document.getElementById(`bubble-${index}`);
          if (bubble) bubble.classList.add("expanded");
          cacheActiveTrackElements(index);
          syncPanelButtons();
          if (audioPlayer.paused) {
            audioPlayer.play().catch(() => {});
          } else {
            audioPlayer.pause();
            try {
              audioPlayer.currentTime = 0;
            } catch (_) {}
            resetTrackProgressUI(index);
          }
          updatePlayIcons();
          updateTopMiniPlayer();
        } else {
          startTrack(index);
        }
      };

      window.playNext = function (event) {
        if (event) event.stopPropagation();
        if (!localPlaylist.length) return;
        let nextIdx = currentIndex + 1;
        if (nextIdx >= localPlaylist.length) nextIdx = 0;
        startTrack(nextIdx);
      };

      window.playPrev = function (event) {
        if (event) event.stopPropagation();
        if (!localPlaylist.length) return;
        let prevIdx = currentIndex - 1;
        if (prevIdx < 0) prevIdx = localPlaylist.length - 1;
        startTrack(prevIdx);
      };

      function updatePlayIcons() {
        document.querySelectorAll(".play-circle").forEach((c) => {
          c.innerHTML = playIcon;
          c.classList.remove("playing");
        });
        document
          .querySelectorAll(".play-pause-btn")
          .forEach((btn) => (btn.innerHTML = playIcon));

        if (currentIndex === -1) return;

        const activeCircle = document.getElementById(`circle-${currentIndex}`);
        const activeBtn = document.getElementById(`main-play-btn-${currentIndex}`);

        if (isAudioLoading) {
          if (activeCircle) activeCircle.innerHTML = loadIcon;
          if (activeBtn) activeBtn.innerHTML = loadIcon;
          return;
        }

        if (!audioPlayer.paused) {
          if (activeCircle) {
            activeCircle.innerHTML = pauseIcon;
            activeCircle.classList.add("playing");
          }
          if (activeBtn) {
            activeBtn.innerHTML = pauseIcon;
          }
        }
      }

      audioPlayer.addEventListener("error", () => {
        isAudioLoading = false;
        clearTimeout(loadTimeout);
        updatePlayIcons();
        updateTopMiniPlayer();
      });

      audioPlayer.addEventListener("waiting", () => {
        isAudioLoading = true;
        updatePlayIcons();
        updateTopMiniPlayer();

        clearTimeout(loadTimeout);
        loadTimeout = setTimeout(() => {
          if (isAudioLoading) {
            isAudioLoading = false;
            updatePlayIcons();
            updateTopMiniPlayer();
          }
        }, 15000);
      });

      audioPlayer.addEventListener("playing", () => {
        isAudioLoading = false;
        clearTimeout(loadTimeout);
        updatePlayIcons();
        updateTopMiniPlayer();
      });
      audioPlayer.addEventListener("canplay", () => {
        isAudioLoading = false;
        clearTimeout(loadTimeout);
        updatePlayIcons();
        updateTopMiniPlayer();
      });
      audioPlayer.addEventListener("pause", () => {
        isAudioLoading = false;
        clearTimeout(loadTimeout);
        try {
          audioPlayer.currentTime = 0;
        } catch (_) {}
        if (currentIndex !== -1) {
          resetTrackProgressUI(currentIndex);
        }
        updatePlayIcons();
        updateTopMiniPlayer();
      });
      audioPlayer.addEventListener("ended", playNext);

      audioPlayer.addEventListener("timeupdate", () => {
        if (
          currentIndex !== -1 &&
          !isSeeking &&
          !audioPlayer.paused &&
          !isNaN(audioPlayer.duration) &&
          isFinite(audioPlayer.duration) &&
          audioPlayer.duration > 0
        ) {
          const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
          if (activeProgressEl) activeProgressEl.value = progress;
          if (activeCurrentTimeEl) {
            activeCurrentTimeEl.innerText = formatTime(audioPlayer.currentTime);
          }
          if (activeTotalTimeEl) {
            activeTotalTimeEl.innerText = formatTime(audioPlayer.duration);
          }
        }
      });

      audioPlayer.addEventListener("loadedmetadata", () => {
        if (
          currentIndex !== -1 &&
          !isNaN(audioPlayer.duration) &&
          isFinite(audioPlayer.duration) &&
          activeTotalTimeEl
        ) {
          activeTotalTimeEl.innerText = formatTime(audioPlayer.duration);
        }
      });

      window.addEventListener("load", () => {
        if (!searchQuery) {
          chatArea.scrollTop = chatArea.scrollHeight;
          updateScrollDownButtonVisibility();
        }
      });

      renderPinnedBar();
      renderPlaylist(true);
    </script>
  </body>
</html>
